name: tests

on: [push, pull_request]

jobs:
  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install numpy scikit-learn pytest   # probe tests need no torch or model
      - name: Run tests
        run: pytest tests/ -q
