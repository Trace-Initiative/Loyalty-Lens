[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-lens"
version = "0.1.0"
description = "Find hidden loyalties inside a language model by reading its activations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karan Singh" }]
keywords = ["ai safety", "interpretability", "activation probing", "model auditing"]
dependencies = [
    "torch>=2.6",
    "transformers>=5.5",
    "accelerate>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.50"]   # only needed for --4bit on a CUDA GPU
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/KaranSinghDev/Loyalty-Lens"

[project.scripts]
loyalty-lens = "loyalty_lens.cli:main"

[tool.setuptools]
packages = ["loyalty_lens"]
